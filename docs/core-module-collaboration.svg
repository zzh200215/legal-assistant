<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">律智检核心模块协作图</title>
  <desc id="desc">展示路由层、法律业务、文档、智能自动化和平台治理模块的协作关系。</desc>
  <style>
    text { font-family: "Microsoft YaHei", "Noto Sans SC", Arial, sans-serif; fill: #172033; }
    .title { font-size: 30px; font-weight: 700; }
    .subtitle { font-size: 15px; fill: #667085; }
    .group { stroke-width: 1.5; stroke-dasharray: 7 5; rx: 14; }
    .group-title { font-size: 16px; font-weight: 700; fill: #344054; }
    .node { stroke-width: 1.5; rx: 10; }
    .node-title { font-size: 16px; font-weight: 700; }
    .node-text { font-size: 13px; fill: #475467; }
    .edge { fill: none; stroke: #98a2b3; stroke-width: 2; marker-end: url(#arrow); }
    .cross { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#98a2b3" />
    </marker>
  </defs>

  <rect width="1440" height="900" fill="#f8fafc" />
  <rect x="24" y="24" width="1392" height="852" rx="18" fill="#ffffff" stroke="#e4e7ec" />
  <text x="64" y="78" class="title">律智检核心模块协作图</text>
  <text x="64" y="106" class="subtitle">业务模块承载法律流程，文档与智能模块提供能力，平台治理模块以横切方式约束全部业务。</text>

  <rect x="535" y="140" width="370" height="82" class="node" fill="#eff6ff" stroke="#3b82f6" />
  <text x="720" y="174" text-anchor="middle" class="node-title">API 路由层</text>
  <text x="720" y="198" text-anchor="middle" class="node-text">认证、法律、合同、文档、任务、Agent、计费与门户接口</text>

  <rect x="60" y="274" width="790" height="250" class="group" fill="#f5f3ff" stroke="#a78bfa" />
  <text x="84" y="306" class="group-title">法律业务域</text>
  <rect x="90" y="334" width="160" height="132" class="node" fill="#ffffff" stroke="#8b5cf6" />
  <text x="170" y="371" text-anchor="middle" class="node-title">法律工作台</text>
  <text x="170" y="396" text-anchor="middle" class="node-text">咨询</text>
  <text x="170" y="418" text-anchor="middle" class="node-text">文书草稿</text>
  <text x="170" y="440" text-anchor="middle" class="node-text">审核队列</text>
  <rect x="280" y="334" width="160" height="132" class="node" fill="#ffffff" stroke="#8b5cf6" />
  <text x="360" y="371" text-anchor="middle" class="node-title">组织与案件</text>
  <text x="360" y="396" text-anchor="middle" class="node-text">成员协作</text>
  <text x="360" y="418" text-anchor="middle" class="node-text">关键日期</text>
  <text x="360" y="440" text-anchor="middle" class="node-text">任务与通知</text>
  <rect x="470" y="334" width="160" height="132" class="node" fill="#ffffff" stroke="#8b5cf6" />
  <text x="550" y="371" text-anchor="middle" class="node-title">合同管理</text>
  <text x="550" y="396" text-anchor="middle" class="node-text">版本与条款</text>
  <text x="550" y="418" text-anchor="middle" class="node-text">风险项</text>
  <text x="550" y="440" text-anchor="middle" class="node-text">审查与对比</text>
  <rect x="660" y="334" width="160" height="132" class="node" fill="#ffffff" stroke="#8b5cf6" />
  <text x="740" y="371" text-anchor="middle" class="node-title">客户门户</text>
  <text x="740" y="396" text-anchor="middle" class="node-text">受限发布</text>
  <text x="740" y="418" text-anchor="middle" class="node-text">OTP 访问</text>
  <text x="740" y="440" text-anchor="middle" class="node-text">反馈与统计</text>

  <rect x="880" y="274" width="500" height="250" class="group" fill="#f0fdf4" stroke="#86efac" />
  <text x="904" y="306" class="group-title">智能与自动化域</text>
  <rect x="910" y="334" width="190" height="132" class="node" fill="#ffffff" stroke="#22c55e" />
  <text x="1005" y="371" text-anchor="middle" class="node-title">法律检索</text>
  <text x="1005" y="396" text-anchor="middle" class="node-text">混合召回</text>
  <text x="1005" y="418" text-anchor="middle" class="node-text">证据核验</text>
  <text x="1005" y="440" text-anchor="middle" class="node-text">图谱增强</text>
  <rect x="1130" y="334" width="220" height="132" class="node" fill="#ffffff" stroke="#22c55e" />
  <text x="1240" y="371" text-anchor="middle" class="node-title">受控 Agent</text>
  <text x="1240" y="396" text-anchor="middle" class="node-text">规划与状态机</text>
  <text x="1240" y="418" text-anchor="middle" class="node-text">MCP 权限守卫</text>
  <text x="1240" y="440" text-anchor="middle" class="node-text">审批与工具执行</text>

  <rect x="60" y="570" width="620" height="210" class="group" fill="#fff7ed" stroke="#fdba74" />
  <text x="84" y="602" class="group-title">文档域</text>
  <rect x="90" y="632" width="170" height="94" class="node" fill="#ffffff" stroke="#f97316" />
  <text x="175" y="667" text-anchor="middle" class="node-title">安全上传</text>
  <text x="175" y="691" text-anchor="middle" class="node-text">MIME、限额、病毒扫描</text>
  <rect x="285" y="632" width="170" height="94" class="node" fill="#ffffff" stroke="#f97316" />
  <text x="370" y="667" text-anchor="middle" class="node-title">处理流水线</text>
  <text x="370" y="691" text-anchor="middle" class="node-text">解析、分块、索引</text>
  <rect x="480" y="632" width="170" height="94" class="node" fill="#ffffff" stroke="#f97316" />
  <text x="565" y="667" text-anchor="middle" class="node-title">交付与导出</text>
  <text x="565" y="691" text-anchor="middle" class="node-text">下载、外发、版本</text>

  <rect x="720" y="570" width="660" height="210" class="group" fill="#eff6ff" stroke="#93c5fd" />
  <text x="744" y="602" class="group-title">平台治理域</text>
  <rect x="750" y="632" width="130" height="94" class="node" fill="#ffffff" stroke="#3b82f6" />
  <text x="815" y="667" text-anchor="middle" class="node-title">权限</text>
  <text x="815" y="691" text-anchor="middle" class="node-text">JWT、RBAC</text>
  <rect x="900" y="632" width="130" height="94" class="node" fill="#ffffff" stroke="#3b82f6" />
  <text x="965" y="667" text-anchor="middle" class="node-title">计费</text>
  <text x="965" y="691" text-anchor="middle" class="node-text">订阅、对账</text>
  <rect x="1050" y="632" width="130" height="94" class="node" fill="#ffffff" stroke="#3b82f6" />
  <text x="1115" y="667" text-anchor="middle" class="node-title">审计</text>
  <text x="1115" y="691" text-anchor="middle" class="node-text">日志、成本</text>
  <rect x="1200" y="632" width="150" height="94" class="node" fill="#ffffff" stroke="#3b82f6" />
  <text x="1275" y="667" text-anchor="middle" class="node-title">通知与连接器</text>
  <text x="1275" y="691" text-anchor="middle" class="node-text">邮件、飞书、Webhook</text>

  <path d="M720 222 L720 274 L170 274 L170 334" class="edge" />
  <path d="M720 222 L720 274 L360 274 L360 334" class="edge" />
  <path d="M720 222 L720 274 L550 274 L550 334" class="edge" />
  <path d="M720 222 L720 274 L740 274 L740 334" class="edge" />
  <path d="M720 222 L720 274 L1005 274 L1005 334" class="edge" />
  <path d="M720 222 L720 274 L1240 274 L1240 334" class="edge" />
  <path d="M250 400 L910 400" class="edge" />
  <path d="M630 400 L1130 400" class="edge" />
  <path d="M175 466 L175 632" class="edge" />
  <path d="M370 466 L370 632" class="edge" />
  <path d="M550 466 L565 632" class="edge" />
  <path d="M260 679 L285 679" class="edge" />
  <path d="M455 679 L480 679" class="edge" />
  <path d="M815 632 L815 540 L170 540 L170 466" class="cross" />
  <path d="M965 632 L965 540 L550 540 L550 466" class="cross" />
  <path d="M1115 632 L1115 540 L1240 540 L1240 466" class="cross" />
  <path d="M1275 632 L1275 540 L740 540 L740 466" class="cross" />
</svg>
